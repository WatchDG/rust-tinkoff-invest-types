name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Checkout invest-contracts
      run: |
        git config http.https://opensource.tbank.ru/.sslCAInfo "$GITHUB_WORKSPACE/certs/russian-trusted-ca.pem"
        git submodule update --init --recursive
    - name: Install protoc
      run: sudo apt-get install -y protobuf-compiler
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --check
    - name: Build
      run: cargo build --verbose
    - name: Docs
      run: cargo doc --verbose
